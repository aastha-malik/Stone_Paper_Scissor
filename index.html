<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>
    <div class="choices">
        <div class="choice" id = "rock">
            <img src="https://imgs.search.brave.com/zCAE_lHqd2UyacTIrPQQEm3lpKJvmOpTgVoufq67ng4/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jZG4z/LmVtb2ppLmdnL2Vt/b2ppcy9yLnBuZw" />
        </div>
        <div class="choice" id = "paper">
            <img src="https://imgs.search.brave.com/XtuUw4_P20tDP0ju4R3YS3raDY28vgEs4GY_tkXUFbw/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jZG4z/LmVtb2ppLmdnL2Vt/b2ppcy9wLnBuZw" />
        </div>
        <div class="choice" id="scissor">
            <img src="https://imgs.search.brave.com/VE0lPf3GpKCA2oFyI4WbG-EhHYRM0RvZeKHxV9hKZp0/rs:fit:500:0:0:0/g:ce/aHR0cHM6Ly9jZG4z/LmVtb2ppLmdnL2Vt/b2ppcy9zLnBuZw" />
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id = "user-score">0</p>
            <p>User</p>
        </div>
        <div class="score">
            <p id="bot-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="msg">Play your move</p>
    </div>    
</body>
